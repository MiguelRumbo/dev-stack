name: Actualizar versiones fijadas

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Actualizar solo esta dependencia (nombre de plugin o repo). Vacío = todas."
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Buscar versiones nuevas
        env:
          ONLY: ${{ inputs.only }}
        run: |
          args=(--apply --report "$RUNNER_TEMP/report.md")
          [ -n "${ONLY:-}" ] && args+=(--only "$ONLY")
          python3 scripts/update-pins.py "${args[@]}"
          bash scripts/sync-vendored.sh

      - name: ¿Hay cambios?
        id: diff
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Validar con la versión nueva
        id: ci
        if: steps.diff.outputs.changed == 'true'
        run: |
          set +e
          bash scripts/ci.sh --claude > "$RUNNER_TEMP/ci.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/ci.log"
          if [ "$code" = 0 ]; then echo "result=verde" >> "$GITHUB_OUTPUT"; else echo "result=rojo" >> "$GITHUB_OUTPUT"; fi

      - name: Abrir PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.ci.outputs.result }}
        run: |
          branch="deps/update-pins-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "chore(deps): actualizar versiones fijadas" -m "Generado por update-pins.yml. CI: $RESULT."
          git push -u origin "$branch"
          {
            echo "CI sobre la versión nueva: **$RESULT**"
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "<details><summary>Salida del CI</summary>"
            echo
            echo '```'
            tail -n 80 "$RUNNER_TEMP/ci.log"
            echo '```'
            echo "</details>"
            echo
            echo "Revisa las líneas ⚠️ y 🔎 antes de mergear. Este PR nunca se mergea solo."
          } > "$RUNNER_TEMP/body.md"
          title="chore(deps): actualizar versiones fijadas"
          [ "$RESULT" = "rojo" ] && title="[CI rojo] $title"
          gh pr create --title "$title" --body-file "$RUNNER_TEMP/body.md" --base "${GITHUB_REF_NAME}" --head "$branch"
